[package]
name = "photo_annotator"
version = "0.1.0"
edition = "2024"
description = "轻量级桌面图片标注工具：面向测试人员的错误截图标注，以项目/文件夹为单位组织管理"
license = "MIT"

# 体积红线 < 5MB：启用 LTO + strip 瘦身，panic=abort 减少运行时
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
# GUI 框架（GPU 渲染，声明式 UI）
slint = "1.13"
# 画布 2D 绘图引擎（矩形/椭圆/箭头/画笔/马赛克）
tiny-skia = "0.11"
# SQLite 持久化（工作区/缩略图/标注层索引）
rusqlite = { version = "0.37", features = ["bundled"] }
# 图片解码（裁剪特性控制体积：PNG/JPG/BMP/GIF/WebP，排除 exr/tiff/avif 等重型格式）
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
# 剪贴板（Ctrl+C 复制标注结果）
arboard = "3"
# 文字标注导出渲染：字体栅格化（TinySkia 无文本 API）
fontdue = "0.9"

[build-dependencies]
# 编译 ui/*.slint 声明文件（build.rs 使用）
slint-build = "1.13"
